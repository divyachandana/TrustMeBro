[project]
name = "trustmebro"
version = "0.2.0"
description = "An immune system for AI-written code"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "anthropic",
    "clickhouse-connect",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "flask"]

[project.scripts]
trustmebro-mcp = "trustmebro.server:main"
trustmebro-hook = "trustmebro.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
